<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Brasa Burger</title><link rel="stylesheet" href="/auth.css"></head><body><main class="auth-card"><div class="brand">BRASA BURGER</div><h1>Entrar</h1><p>Acesse sua conta para finalizar pedidos ou entrar no painel administrativo.</p><div class="mode"><button class="active" data-mode="customer">Cliente</button><button data-mode="admin">Equipe Brasa</button></div><form id="loginForm"><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" minlength="12" required></div><button class="btn">Entrar</button></form><div id="status" class="status"></div><a class="secondary" href="/cadastro">Ainda não tenho conta</a><a class="secondary" href="/">← Voltar à loja</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/shared/supabase.js"></script><script>let mode='customer';document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b))});const status=document.getElementById('status');const show=(m,e=false)=>{status.textContent=m;status.className='status'+(e?' error':'');status.style.display='block'};document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();try{show('Entrando…');await BrasaSupabase.signIn(email.value,password.value);if(mode==='admin'){const role=await BrasaSupabase.getStaffRole();if(!role){await BrasaSupabase.signOut();throw new Error('Esta conta não possui acesso administrativo.')}location.href='/admin/admin.html'}else{const p=new URLSearchParams(location.search);location.href=p.get('return')||'/'}}catch(err){show(err.message||'Não foi possível entrar.',true)}};BrasaSupabase.init().then(ok=>{if(!ok)show('Este ambiente ainda não foi conectado ao Supabase.',true)});</script></body></html>
