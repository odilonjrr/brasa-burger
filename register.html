<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta — Brasa Burger</title><link rel="stylesheet" href="/auth.css"></head><body><main class="auth-card"><div class="brand">BRASA BURGER</div><h1>Criar conta</h1><p>Cadastre-se para salvar seus dados e acompanhar pedidos.</p><form id="registerForm"><div class="field"><label for="name">Nome completo</label><input id="name" required maxlength="120"></div><div class="field"><label for="phone">WhatsApp</label><input id="phone" required maxlength="20"></div><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="new-password" minlength="12" required></div><button class="btn">Criar conta</button></form><div id="status" class="status"></div><p class="fine">Use pelo menos 12 caracteres. A verificação de e-mail deve permanecer habilitada no Supabase Auth.</p><a class="secondary" href="/login">Já tenho conta</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/shared/supabase.js"></script><script>const status=document.getElementById('status');const show=(m,e=false)=>{status.textContent=m;status.className='status'+(e?' error':'');status.style.display='block'};registerForm.onsubmit=async e=>{e.preventDefault();try{if(password.value.length<12)throw new Error('A senha precisa ter pelo menos 12 caracteres.');show('Criando sua conta…');const data=await BrasaSupabase.signUp({email:email.value,password:password.value,fullName:name.value,phone:phone.value});show(data.session?'Conta criada. Redirecionando…':'Conta criada. Verifique seu e-mail para confirmar o acesso.');if(data.session)setTimeout(()=>location.href='/',800)}catch(err){show(err.message||'Não foi possível criar a conta.',true)}};BrasaSupabase.init().then(ok=>{if(!ok)show('Este ambiente ainda não foi conectado ao Supabase.',true)});</script></body></html>
